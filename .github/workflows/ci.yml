name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      upload_package:
        description: Upload the verified Linux package for a release.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} / Node 24
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - id: check
        run: npm run check
      - if: inputs.upload_package && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: ${{ steps.check.outputs.tarball }}
          if-no-files-found: error
          compression-level: 0
          overwrite: true
