name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  queue: max
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  check:
    uses: ./.github/workflows/ci.yml
    with:
      upload_package: true

  publish-npm:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Check the tag and release notes
        id: metadata
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version." >&2
            exit 1
          fi
          notes=".github/releases/$GITHUB_REF_NAME.md"
          if [ ! -s "$notes" ]; then
            echo "Release notes are missing or empty: $notes" >&2
            exit 1
          fi
          npm_tag=latest
          prerelease=false
          if [[ "${version%%+*}" == *-* ]]; then
            npm_tag=next
            prerelease=true
          fi
          printf 'PACKAGE_NAME=%s\nPACKAGE_VERSION=%s\nPACKAGE_FILE=%s-%s.tgz\nNPM_TAG=%s\n' "$name" "$version" "$name" "$version" "$npm_tag" >> "$GITHUB_ENV"
          printf 'prerelease=%s\n' "$prerelease" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: package
      - name: Publish or verify the npm package
        run: |
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version --json > "$RUNNER_TEMP/npm-version.json"; then
            expected_integrity="sha512-$(openssl dgst -sha512 -binary "package/$PACKAGE_FILE" | openssl base64 -A)"
            published_integrity=$(npm view "$PACKAGE_NAME@$PACKAGE_VERSION" dist.integrity)
            if [ "$published_integrity" != "$expected_integrity" ]; then
              echo "$PACKAGE_NAME@$PACKAGE_VERSION is already published with a different package." >&2
              echo "Expected $expected_integrity, found $published_integrity." >&2
              exit 1
            fi
            echo "$PACKAGE_NAME@$PACKAGE_VERSION is already published with this build."
            exit 0
          fi

          if ! jq -e '.error.code == "E404"' "$RUNNER_TEMP/npm-version.json" > /dev/null; then
            echo "The registry did not report $PACKAGE_NAME@$PACKAGE_VERSION as missing:" >&2
            cat "$RUNNER_TEMP/npm-version.json" >&2
            exit 1
          fi

          publish_args=(publish "./package/$PACKAGE_FILE" --ignore-scripts --access public --provenance)
          if [ "$NPM_TAG" = next ]; then
            publish_args+=(--tag next)
          fi
          npm "${publish_args[@]}"

  github-release:
    needs: publish-npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: .github/releases/${{ github.ref_name }}.md
          prerelease: ${{ needs.publish-npm.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.publish-npm.outputs.prerelease == 'true' && 'false' || 'legacy' }}
